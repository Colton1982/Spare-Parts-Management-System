{% extends "base.html" %}
{% block title %}{{ tr('page_password') }} - Spare Parts Management System{% endblock %}
{% block page_title %}>{{ tr('page_password') }}{% endblock %}
{% block content %}
<div class="card narrow">
  <form method="post">
    <label class="f-label">{{ tr('原密码') }}<input class="f-input" type="password" name="old_pwd" required></label>
    <label class="f-label">{{ tr('新密码（≥6位）') }}<input class="f-input" type="password" name="new_pwd" required></label>
    <label class="f-label">{{ tr('确认新密码') }}<input class="f-input" type="password" name="new_pwd2" required></label>
    <button class="btn btn-primary" type="submit">{{ tr('确认修改') }}</button>
  </form>
</div>
{% endblock %}
